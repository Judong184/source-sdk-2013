name: Build Source SDK 2013 Mod

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: |
          cd src
          call createallprojects.bat
        shell: cmd

      - name: Find generated solution files (Debug)
        run: |
          cd src
          dir *.sln /s
        shell: cmd

      - name: Build solution (Release)
        run: |
          cd src
          msbuild everything.sln /p:Configuration=Release /p:Platform=Win32 /m
        shell: cmd

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: source-sdk-binaries-windows
          path: |
            src/game/client/Release_*/*.dll
            src/game/server/Release_*/*.dll
